<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f3a1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Park Builder" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>Park Builder</title>
    <meta name="description" content="길을 깔고 놀이기구를 지어 손님을 모으는 테마파크 경영 시뮬레이션" />
    <!-- 카카오톡·SNS 링크 미리보기 (이미지는 절대 주소여야 한다) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Park Builder" />
    <meta property="og:title" content="Park Builder" />
    <meta property="og:description" content="길을 깔고 놀이기구를 지어 손님을 모으는 테마파크 경영 시뮬레이션" />
    <meta property="og:url" content="https://test-game.vercel.app/" />
    <meta property="og:image" content="https://test-game.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="놀이기구와 손님으로 북적이는 Park Builder 공원" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* 롤러코스터 타이쿤풍 창: 올리브색 본문 + 빨간 제목줄 + 밝은/어두운 테두리(베벨) */
      :root {
        --win: #6f7d4f; --win-2: #5f6c42; --win-light: #b5c48a; --win-dark: #2f3820;
        --title: #b33a2c; --title-2: #84251b; --title-dark: #4f140e;
        --btn: #87965f; --btn-2: #6d7b49; --btn-light: #c9d79c; --btn-dark: #3a4428;
        --bar: #3c4527; --bar-2: #2d3420;
        --accent: #2f8f55; --gold: #ffd75a; --muted: rgba(255,255,255,0.72); --line: #3a4428;
        --text-shadow: 1px 1px 0 rgba(0,0,0,0.65);
        --font: "Trebuchet MS", Verdana, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #1f3a1c; font-family: var(--font); color: #fff; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      button {
        font: inherit; color: #fff; text-shadow: var(--text-shadow); cursor: pointer;
        background: linear-gradient(var(--btn), var(--btn-2));
        border: 2px solid; border-color: var(--btn-light) var(--btn-dark) var(--btn-dark) var(--btn-light);
        border-radius: 2px;
      }
      button:hover { filter: brightness(1.1); }
      button:active, button.active {
        background: linear-gradient(#566335, #67753f);
        border-color: var(--btn-dark) var(--btn-light) var(--btn-light) var(--btn-dark);
      }
      button.active { box-shadow: inset 0 0 0 1px var(--gold); }
      button:disabled { filter: grayscale(0.6) brightness(0.8); cursor: not-allowed; }
      [hidden] { display: none !important; }

      /* 창 공통 */
      .card, #modal .dialog, #track-bar {
        background: linear-gradient(var(--win), var(--win-2));
        border: 2px solid; border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
        box-shadow: 0 0 0 1px #111, 3px 4px 0 rgba(0,0,0,0.35);
        text-shadow: var(--text-shadow);
      }
      .card .head, #modal h2 {
        display: flex; justify-content: space-between; align-items: center;
        background: linear-gradient(var(--title), var(--title-2));
        border-bottom: 2px solid var(--title-dark);
        color: #fff; font-weight: 700;
      }
      .card .head button, .card .head div button {
        min-width: 20px; height: 18px; padding: 0 5px; line-height: 1; font-size: 12px;
        background: linear-gradient(#c94a3c, #962e23);
        border-color: #ef9a8e #4f140e #4f140e #ef9a8e;
      }
      .card .head div { display: flex; gap: 3px; }

      #hud {
        position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
        padding: 5px 12px; font-size: 14px; text-shadow: var(--text-shadow);
        background: linear-gradient(var(--bar), var(--bar-2));
        border-bottom: 2px solid #11160b; box-shadow: inset 0 -1px 0 #5d6a3e;
      }
      #hud > span:not(.speed):not(.fee) {
        padding: 2px 9px; background: rgba(0,0,0,0.28);
        border: 1px solid; border-color: #161b0e #6b7848 #6b7848 #161b0e;
      }
      #money { font-weight: 700; font-size: 17px; color: var(--gold); min-width: 110px; }
      #money::before { content: '💰 '; }
      #date::before { content: '📅 '; }
      #guests::before { content: '👥 '; }
      #rating::before { content: '⭐ '; }
      #money.neg { color: #ff6b6b; }
      #rating { font-weight: 600; cursor: help; }
      #rating[data-level="low"] { color: #ff8a80; }
      #rating[data-level="mid"] { color: var(--gold); }
      #rating[data-level="high"] { color: #a6f0b8; }
      .speed { display: inline-flex; gap: 2px; }
      .speed button { min-width: 34px; padding: 2px 6px; }
      .fee { display: inline-flex; gap: 6px; align-items: center; }
      .stepper { display: inline-flex; align-items: center; gap: 2px; }
      .stepper button { padding: 0 6px; min-width: 22px; }
      .stepper b { min-width: 52px; text-align: center; }
      .stepper.over b { color: #ff8a80; }
      #finance-btn, #save-btn, #new-btn, #sound-btn { padding: 2px 10px; }
      #help-btn { padding: 2px 9px; font-weight: 700; }

      /* 상태 메시지: RCT의 노란 안내 쪽지 */
      #hint, #goal {
        position: fixed; top: 46px; padding: 3px 10px; font-size: 13px; pointer-events: none;
        color: #2a2210; background: #f6e9a8; border: 1px solid #8a7a3a; box-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      }
      #hint { left: 16px; }
      #goal { right: 16px; }

      #toolbar {
        position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 14px; flex-wrap: wrap; padding: 4px 12px 6px;
        background: linear-gradient(var(--bar), var(--bar-2));
        border-top: 2px solid #11160b; box-shadow: inset 0 1px 0 #5d6a3e;
      }
      #toolbar .title { font-size: 11px; color: var(--muted); margin: 0 0 2px 2px; text-shadow: var(--text-shadow); }
      #toolbar .row { display: flex; gap: 3px; }
      #toolbar button { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 64px; padding: 2px 4px 3px; font-size: 12px; }
      #toolbar button img { width: 44px; height: 40px; image-rendering: auto; filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.35)); }
      #toolbar button small { font-size: 10px; opacity: 0.85; color: var(--gold); }

      .card { position: fixed; top: 84px; width: 270px; padding: 0 10px 10px; font-size: 13px; }
      .card .head { margin: 0 -10px 8px; padding: 3px 4px 3px 9px; font-size: 14px; }
      #panel { right: 12px; }
      #finance { left: 292px; width: 330px; }
      #tutorial { left: 12px; width: 262px; }
      #tu-list { margin: 0 0 8px; padding: 0; list-style: none; }
      #tu-list li { padding: 2px 0 2px 22px; position: relative; color: var(--muted); }
      #tu-list li::before { content: '○'; position: absolute; left: 4px; }
      #tu-list li.done { color: #c8f5c0; }
      #tu-list li.done::before { content: '✔'; }
      #tu-list li.current { color: #fff; font-weight: 700; }
      #tu-list li.current::before { content: '▶'; color: var(--gold); }
      #tu-text {
        padding: 6px 8px; line-height: 1.5; color: #2a2210; text-shadow: none;
        background: #f6e9a8; border: 1px solid; border-color: #8a7a3a #fffbe0 #fffbe0 #8a7a3a;
      }
      @keyframes hint-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,90,0.0); } 50% { box-shadow: 0 0 0 4px rgba(255,215,90,0.85); } }
      #toolbar button.hint { border-color: var(--gold); animation: hint-pulse 1.3s ease-in-out infinite; }
      .p-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 4px; }
      .p-row:nth-child(odd) { background: rgba(0,0,0,0.1); }
      .p-row > span:first-child { color: var(--muted); }
      #p-status[data-ok="0"] { color: #ffb0a8; }
      #p-demolish, #p-edit, #p-test { width: 100%; margin-top: 8px; padding: 4px; }
      #finance table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.12); }
      #finance th { text-align: left; font-weight: 400; color: var(--muted); padding: 3px 4px; }
      #finance td { text-align: right; padding: 3px 4px 3px 8px; font-variant-numeric: tabular-nums; }
      #finance thead th:not(:first-child) { text-align: right; color: #fff; }
      #finance tr.total th, #finance tr.total td { border-top: 1px solid var(--line); font-weight: 700; color: #fff; }
      #f-extra { margin-top: 8px; color: var(--muted); font-size: 12px; }
      #gpanel, #spanel { right: 12px; }
      #s-fire { width: 100%; margin-top: 8px; padding: 4px; }
      .bar { display: inline-block; width: 120px; height: 8px; background: #2a3320; border: 1px solid; border-color: #1a200f #8e9c68 #8e9c68 #1a200f; overflow: hidden; }
      .bar i { display: block; height: 100%; background: #5fd06e; }
      .bar.bad i { background: #e06a5a; }

      #modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
      #modal .dialog { width: min(420px, calc(100vw - 32px)); padding: 0 18px 16px; }
      #modal h2 { margin: 0 -18px 12px; padding: 5px 12px; font-size: 16px; }
      #modal p { margin: 0 0 12px; color: #f2f5e8; line-height: 1.5; }
      #m-rows { width: 100%; border-collapse: collapse; margin-bottom: 14px; background: rgba(0,0,0,0.12); }
      #m-rows th { text-align: left; font-weight: 400; color: var(--muted); padding: 4px 6px; }
      #m-rows td { text-align: right; padding: 4px 6px; font-variant-numeric: tabular-nums; }
      #m-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
      #m-buttons button { padding: 5px 14px; }
      #m-buttons button.primary, #t-buttons button.primary {
        background: linear-gradient(#3aa565, #277a47); border-color: #9be8b6 #154528 #154528 #9be8b6; font-weight: 600;
      }
      #track-bar { position: fixed; bottom: 112px; left: 50%; transform: translateX(-50%); z-index: 5; width: min(760px, calc(100vw - 24px)); padding: 8px 12px; font-size: 13px; }
      #t-info { font-weight: 600; }
      #t-head > span { display: block; }
      #t-stats { color: var(--gold); margin: 2px 0 6px; }
      #t-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
      #t-buttons button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 70px; padding: 4px 8px; }
      #t-buttons button small { font-size: 10px; opacity: 0.8; }
      #t-buttons button:disabled { opacity: 0.45; }
      #t-buttons button.primary { margin-left: auto; }
      #t-msg { margin-top: 6px; color: var(--muted); }
      #t-msg[data-bad="1"] { color: #ffb0a8; }

      /* 도구가 켜져 있을 때 오른쪽 아래에 뜨는 버튼 (R / Esc 키 대응) */
      #tool-actions { position: fixed; right: 12px; bottom: 118px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
      #tool-actions button { min-width: 64px; min-height: 40px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
      #rotate-hint { display: none; }
      #tb-toggle { display: none; }
      @media (pointer: fine) { #tool-actions { display: none; } } /* 마우스·키보드(R/Esc)가 있는 PC에서는 숨김 */

      /* ===== 휴대폰 가로 화면 (PC 화면은 바뀌지 않음) ===== */
      @media (pointer: coarse) and (max-height: 640px) {
        :root { --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
        button { min-height: 32px; }
        #hud {
          flex-wrap: nowrap; overflow-x: auto; gap: 4px 8px; font-size: 12px;
          padding: calc(2px + var(--sat)) calc(6px + var(--sar)) 2px calc(6px + var(--sal)); scrollbar-width: none;
        }
        #hud::-webkit-scrollbar { display: none; }
        #hud > * { flex: none; }
        #money { font-size: 14px; min-width: 0; }
        #hud > span:not(.speed):not(.fee) { padding: 1px 6px; }
        .speed button { min-width: 34px; min-height: 30px; }
        #finance-btn, #save-btn, #new-btn, #sound-btn, #help-btn { padding: 2px 8px; min-height: 30px; }
        .stepper button { min-width: 30px; min-height: 30px; }
        #hint, #goal { top: calc(36px + var(--sat)); font-size: 11px; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #hint { left: calc(8px + var(--sal)); }
        #goal { right: calc(8px + var(--sar)); }
        #toolbar {
          flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; gap: 10px; -webkit-overflow-scrolling: touch;
          padding: 2px calc(6px + var(--sar)) calc(3px + var(--sab)) calc(6px + var(--sal)); scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        #toolbar .group { flex: none; }
        #toolbar .title { font-size: 10px; margin: 0 0 1px 2px; }
        #toolbar button { min-width: 52px; padding: 1px 3px 2px; font-size: 11px; }
        #toolbar button img { width: 32px; height: 29px; }
        #toolbar button small { font-size: 9px; }
        #tool-actions { right: calc(10px + var(--sar)); bottom: calc(var(--tb-reserve, 90px) + var(--sab) * 0); }
        #tb-toggle {
          display: block; position: fixed; z-index: 4; left: calc(8px + var(--sal)); bottom: var(--tb-h, 86px);
          min-width: 76px; min-height: 28px; padding: 2px 12px; font-size: 13px; font-weight: 700;
          border-bottom: 0; border-radius: 6px 6px 0 0;
        }
        body.tb-folded #tb-toggle { bottom: var(--sab); border-bottom: 2px solid var(--btn-dark); border-radius: 6px; }
        body.tb-folded #toolbar { display: none; }
        /* 패널: HUD(약 36px)와 툴바(약 70px) 사이에서 스크롤 */
        .card {
          top: calc(36px + var(--sat)); width: 230px; font-size: 12px;
          box-sizing: border-box; max-height: calc(100dvh - 40px - var(--sat) - var(--tb-reserve, 90px) - var(--sab)); overflow-y: auto; overscroll-behavior: contain;
        }
        #panel, #gpanel, #spanel { right: calc(8px + var(--sar)); }
        #finance { left: calc(8px + var(--sal)); width: min(330px, 46vw); }
        #tutorial { left: calc(8px + var(--sal)); width: 220px; }
        .card .head { position: sticky; top: 0; z-index: 1; }
        .card .head button, .card .head div button { min-width: 36px; height: 30px; font-size: 16px; }
        .p-row { padding: 4px; }
        #p-demolish, #p-edit, #p-test, #s-fire { min-height: 36px; }
        #modal .dialog { max-height: calc(100dvh - 24px); overflow-y: auto; }
        #m-buttons button { min-height: 38px; }
        #track-bar {
          bottom: calc(var(--tb-reserve, 90px) + var(--sab) * 0); width: min(620px, calc(100vw - 24px - var(--sal) - var(--sar)));
          box-sizing: border-box; max-height: calc(100dvh - 40px - var(--sat) - var(--tb-reserve, 90px) - var(--sab)); overflow-y: auto; padding: 5px 8px; font-size: 12px;
        }
        #t-buttons { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
        #t-buttons button { flex: none; min-width: 60px; min-height: 40px; padding: 3px 6px; }
        #t-stats { margin: 1px 0 4px; }
        /* 트랙 편집 중에는 아래 도구 막대를 숨겨 공원을 넓게 보여 준다(편집 바만 남김) */
        body.track-editing #toolbar, body.track-editing #tb-toggle { display: none; }
        body.track-editing #track-bar { bottom: var(--sab); max-height: calc(100dvh - 40px - var(--sat) - var(--sab)); }
        /* 편집 바를 한 줄 정보 + 버튼 한 줄로 납작하게: 공원이 화면 대부분을 차지하도록 */
        #track-bar {
          left: calc(6px + var(--sal)); right: calc(6px + var(--sar)); transform: none; width: auto;
          padding: 3px 6px 4px; font-size: 11px; line-height: 1.3;
          background: linear-gradient(rgba(111,125,79,0.94), rgba(95,108,66,0.94));
        }
        #t-head { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
        #t-info { flex: none; }
        #t-stats { margin: 0; font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
        #t-msg { margin: 0 0 3px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #t-buttons { gap: 3px; }
        #t-buttons button { min-width: 50px; min-height: 36px; padding: 2px 5px; font-size: 12px; }
        #t-buttons button small { font-size: 9px; }
        #t-buttons .key { display: none; }
        /* 편집하는 동안 시작 가이드·안내 쪽지는 숨긴다(트랙이 가려지지 않게) */
        body.track-editing #tutorial, body.track-editing #hint { display: none !important; }
      }
      /* 큰 폰·태블릿 등 위 조건에 안 맞는 터치 기기도 편집 중엔 도구 막대를 숨긴다 */
      @media (pointer: coarse) {
        body.track-editing #toolbar, body.track-editing #tb-toggle, body.track-editing #tutorial { display: none !important; }
        body.track-editing #track-bar { bottom: env(safe-area-inset-bottom, 0px); }
        #t-buttons .key { display: none; }
      }

      /* 세로로 들면 가로 안내를 덮어서 보여 준다 (터치 기기만) */
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-hint {
          display: flex; position: fixed; inset: 0; z-index: 100; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; padding: 24px; text-align: center; font-size: 18px; font-weight: 700; background: #1f3a1c; text-shadow: var(--text-shadow);
        }
        #rotate-hint .phone { font-size: 64px; display: inline-block; animation: rot-phone 2.4s ease-in-out infinite; }
        @keyframes rot-phone { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <span id="money"></span>
      <span id="date"></span>
      <span id="guests"></span>
      <span id="rating"></span>
      <span id="weather" style="cursor: help"></span>
      <span class="speed">
        <button data-speed="0" title="일시정지 (Space)">⏸</button>
        <button data-speed="1" title="1배속 (1)">1×</button>
        <button data-speed="2" title="2배속 (2)">2×</button>
        <button data-speed="4" title="4배속 (3)">4×</button>
      </span>
      <span class="fee">입장료 <span id="fee-ctl"></span></span>
      <button id="finance-btn">재무</button>
      <button id="save-btn" title="지금 저장 (자동 저장도 됩니다)">저장</button>
      <button id="help-btn" title="시작 가이드 열기/닫기">?</button>
      <button id="sound-btn" title="효과음 켜기/끄기"></button>
      <button id="new-btn">새 게임</button>
    </div>
    <div id="hint"></div>
    <div id="goal"></div>
    <div id="tutorial" class="card" hidden>
      <div class="head"><b>시작 가이드 <span id="tu-count"></span></b><div><button id="tu-fold" title="접기/펼치기">▾</button><button id="tu-close" title="닫기 (? 버튼으로 다시 열 수 있어요)">×</button></div></div>
      <div id="tu-body">
        <ol id="tu-list"></ol>
        <div id="tu-text"></div>
      </div>
    </div>
    <div id="panel" class="card" hidden>
      <div class="head"><b id="p-name"></b><button id="p-close" title="닫기 (Esc)">×</button></div>
      <div class="p-row"><span>상태</span><span id="p-status"></span></div>
      <div class="p-row" id="p-rel-row"><span>신뢰도</span><span id="p-rel"></span></div>
      <div class="p-row"><span>특징</span><span id="p-trait"></span></div>
      <div class="p-row" id="p-thrill-row"><span>강도 / 멀미</span><span id="p-thrill"></span></div>
      <div class="p-row"><span>대기/이용</span><span id="p-queue"></span></div>
      <div class="p-row"><span>예상 대기</span><span id="p-wait"></span></div>
      <div class="p-row"><span>누적 이용</span><span id="p-served"></span></div>
      <div class="p-row"><span>누적 수익</span><span id="p-income"></span></div>
      <div class="p-row"><span>하루 유지비</span><span id="p-upkeep"></span></div>
      <div class="p-row"><span>이용 요금</span><span id="p-price-ctl"></span></div>
      <div class="p-row"><span>적정 요금</span><span id="p-fair"></span></div>
      <button id="p-edit" hidden>트랙 편집</button>
      <button id="p-test" hidden>시운전</button>
      <button id="p-demolish"></button>
    </div>
    <div id="finance" class="card" hidden>
      <div class="head"><b>재무</b><button id="f-close" title="닫기">×</button></div>
      <table>
        <thead><tr><th></th><th>이번 달</th><th id="f-prev-head">지난 달</th></tr></thead>
        <tbody id="f-body"></tbody>
      </table>
      <div id="f-extra"></div>
    </div>
    <div id="track-bar" hidden>
      <div id="t-head"><span id="t-info"></span><span id="t-stats"></span></div>
      <div id="t-msg"></div>
      <div id="t-buttons"></div>
    </div>
    <div id="tool-actions" hidden>
      <button id="act-rotate" title="회전 (R)">회전</button>
      <button id="act-cancel" title="취소 (Esc)">취소</button>
    </div>
    <button id="tb-toggle" title="도구 막대 접기/펼치기"></button>
    <div id="toolbar"></div>
    <div id="rotate-hint"><span class="phone">📱</span><span>가로로 돌려 주세요</span><small style="font-weight:400;opacity:.8">Park Builder는 가로 화면에서 플레이합니다</small></div>
    <div id="modal" hidden>
      <div class="dialog">
        <h2 id="m-title"></h2>
        <p id="m-msg"></p>
        <table id="m-rows"></table>
        <div id="m-buttons"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
