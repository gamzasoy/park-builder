<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Park Builder</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a1f; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 16px; align-items: center;
        padding: 8px 16px; background: rgba(15, 25, 20, 0.85); color: #fff; pointer-events: none;
      }
      #money { font-weight: 700; font-size: 18px; color: #ffd75a; min-width: 110px; }
      #guests { font-size: 14px; min-width: 80px; }
      #hint { font-size: 14px; opacity: 0.9; }
      #toolbar {
        position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 20px; flex-wrap: wrap;
        padding: 8px 16px; background: rgba(15, 25, 20, 0.9); color: #fff;
      }
      #toolbar .title { font-size: 11px; opacity: 0.6; margin-bottom: 4px; }
      #toolbar .row { display: flex; gap: 6px; }
      #toolbar button {
        display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px;
        padding: 6px 8px; border: 1px solid #456; border-radius: 6px; background: #25382d; color: #fff; cursor: pointer;
      }
      #toolbar button small { font-size: 11px; opacity: 0.7; }
      #toolbar button:hover { background: #31503c; }
      #toolbar button.active { background: #2f8f55; border-color: #8fe0aa; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"><span id="money"></span><span id="guests"></span><span id="hint"></span></div>
    <div id="toolbar"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
